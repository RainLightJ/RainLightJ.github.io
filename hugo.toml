baseURL = 'https://RainLightJ.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'RainLight 的博客'
theme = 'reimu'

enableRobotsTXT = true
buildDrafts = false
buildFuture = true
buildExpired = false

hasCJKLanguage = true

[minify]
disableXML = true
minifyOutput = true

# ---------------- 主题参数 ----------------
[params]
author = 'RainLight'
description = '记录技术、折腾与日常'
avatar = 'avatar.jpg'
mainSections = ['post']
banner = 'images/banner_light.webp'
toc = true
show_update_time = true
anchor_icon = false

# 侧边栏小组件（只保留分类与最新文章，彻底剔除标签、标签云与归档）
widgets = ['category', 'recent_posts']

[params.preloader]
enable = true
text = '正在加载中...'
rotate = true

  # 副标题（首页大图上的那行字）
  [params.subtitle]
  text = '记录技术、折腾与日常'

    [params.subtitle.typing]
    enable = false

  # 侧边栏
  [params.sidebar]
  position = 'right'
  menu = false

    [params.sidebar.article]
    show_common = true

  # 自定义注入代码（带版本号防浏览器强缓存）
  [params.injector]
  head_end = '<script src="/custom.js?v=20260921_6"></script><link rel="stylesheet" href="/custom.css?v=20260921_6">'

  # 开启 PJAX 无刷新切页（全站页面跳转不重新加载网页，音乐与动效持续播放不断流）
  [params.pjax]
  enable = true

  # 关闭原主题底部播放器（采用自定义左上角轻量黑胶小圆环播放器）
  [params.player]
    [params.player.aplayer]
    enable = false
    [params.player.meting]
    enable = false

  # 深色模式
  [params.dark_mode]
  button = true
  type = 'auto'

  # 页脚
  [params.footer]
  since = false
  powered = false
  count = false
  busuanzi = false

  # 社交链接
  [params.social]
  github = 'https://github.com/RainLightJ'

  # 导航菜单：首页、分类、其他（杂类的小玩意）、关于
  [[params.menu]]
  name = 'home'
  title = '首页'
  url = ''
  icon = false

  [[params.menu]]
  name = 'categories'
  title = '分类'
  url = 'categories'
  icon = false

  [[params.menu]]
  name = 'others'
  title = '其他'
  url = 'categories/其他'
  icon = false

  [[params.menu]]
  name = 'about'
  title = '关于'
  url = 'about'
  icon = false

# 分类体系定义（仅开启 categories，彻底关闭 tags 索引）
[taxonomies]
  category = 'categories'


# ---------------- Markdown ----------------
[markup]
  [markup.highlight]
  noClasses = true
  codeFences = true
  guessSyntax = true
  lineNos = false

  [markup.goldmark.renderer]
  unsafe = true
